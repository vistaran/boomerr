name: CI & Quality Assurance

on:
  push:
    branches: [ "main", "develop", "opensource/**" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, bcmath, curl, sockets, intl, zip, sqlite3, pdo_sqlite
          coverage: none

      - name: Check PHP Syntax (Lint)
        run: |
          find backend/app -name "*.php" -print0 | xargs -0 -n1 -P4 php -l
          find backend/config -name "*.php" -print0 | xargs -0 -n1 -P4 php -l
          find backend/routes -name "*.php" -print0 | xargs -0 -n1 -P4 php -l

      - name: Prepare Environment File
        working-directory: backend
        run: cp .env.example .env

      - name: Install Composer Dependencies
        working-directory: backend
        env:
          BROADCAST_CONNECTION: log
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate App Key
        working-directory: backend
        run: php artisan key:generate --force

      - name: Run Backend Unit Tests
        working-directory: backend
        env:
          BROADCAST_CONNECTION: 'null'
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test --testsuite=Unit

  frontend-checks:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Type Check & Production Build
        working-directory: frontend
        run: npm run build

  docker-syntax-check:
    name: Docker Configuration Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Validate Docker Compose Config
        run: |
          cp .env.example .env
          docker compose config --quiet
