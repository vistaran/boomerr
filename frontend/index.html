<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="src/assets/favicon.ico" />
  <title>Boomerr</title>
  <script>
    (function() {
      var p = window.location.pathname;
      if (p.startsWith('/admin')) {
        document.title = 'Boomerr Admin';
      } else if (p.startsWith('/dashboard')) {
        document.title = 'Boomerr - Dashboard';
      } else if (p.startsWith('/overview')) {
        document.title = 'Boomerr - Domains';
      } else if (p.startsWith('/ssl-monitoring')) {
        document.title = 'Boomerr - SSL Monitoring';
      } else if (p.startsWith('/incidents')) {
        document.title = 'Boomerr - Incidents';
      } else if (p.startsWith('/status-pages')) {
        document.title = 'Boomerr - Status Pages';
      } else if (p.startsWith('/departments')) {
        document.title = 'Boomerr - Departments';
      } else if (p.startsWith('/logs')) {
        document.title = 'Boomerr - Logs';
      } else if (p.startsWith('/billing')) {
        document.title = 'Boomerr - Billing';
      } else if (p.startsWith('/settings') || p.startsWith('/email-preferences')) {
        document.title = 'Boomerr - Settings';
      } else if (p.startsWith('/notifications')) {
        document.title = 'Boomerr - Notifications';
      } else if (p.startsWith('/status')) {
        document.title = 'Boomerr System Status';
      } else if (p.startsWith('/login')) {
        document.title = 'Boomerr - Login';
      }
    })();
  </script>

  <style>
    /* Absolute Minimal CSS for Zero-Flash Experience */
    html, body { background: #050505 !important; margin: 0; padding: 0; color-scheme: dark; overflow: hidden; }
    html[data-admin-theme="light"],
    html[data-admin-theme="light"] body {
      background: #f8fafc !important;
      color-scheme: light !important;
    }
    
    /* Prevent dark color-scheme from turning Razorpay modal checkout iframe background opaque white */
    .razorpay-container {
      background: transparent !important;
    }

    .razorpay-container iframe,
    .razorpay-checkout-frame,
    iframe[name*="razorpay"],
    iframe[src*="razorpay"],
    [class*="razorpay"] {
      background-color: transparent !important;
      color-scheme: light !important;
    }

    #initial-loader {
      position: fixed;
      inset: 0;
      background: #050505;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999999;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(37, 99, 235, 0.1);
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loader-text {
      margin-top: 24px;
      color: white;
      font-family: -apple-system, system-ui, sans-serif;
      font-weight: 900;
      letter-spacing: 0.3em;
      font-size: 11px;
      text-transform: uppercase;
      opacity: 0.9;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <script>
    // --- SUPREME AUTH ORCHESTRATOR (OMNICHANNEL EDITION) ---
    (function () {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const shop = urlParams.get('shop');
        const domainUlid = urlParams.get('domain_ulid');

        // Persistent popup identification
        if (window.name === 'shopify-login') { sessionStorage.setItem('is_dm_auth_popup', '1'); }
        const isPopup = window.name === 'shopify-login' ||
          window.opener !== null ||
          sessionStorage.getItem('is_dm_auth_popup') === '1';

        // 1. IFRAME BREAKOUT & OAUTH REDIRECT
        // If we have a shop but no token, we MUST initiate auth immediately, 
        // regardless of whether we are in a popup or a main tab.
        if (shop && !token && !window.location.pathname.includes('/auth/shopify')) {
          const authUrl = '/auth/shopify?shop=' + encodeURIComponent(shop);

          // If in iframe, breakout and redirect
          if (window.top !== window.self) {
            window.top.location.href = authUrl;
          } else {
            // If already at top level (e.g. popup or direct navigation), just redirect
            window.location.href = authUrl;
          }
          return;
        }

        // 2. STANDARD IFRAME BREAKOUT (Fallback)
        if (window.top !== window.self) {
          window.top.location.href = window.location.href;
          return;
        }

        // 3. SUCCESS HANDSHAKE (In the Popup)
        if (token && isPopup) {
          const targetPath = domainUlid ? ("/overview/" + domainUlid + "/details") : "/overview";
          localStorage.setItem('dm_token', token);
          if (shop) {
            localStorage.setItem('dm_user', JSON.stringify({ id: 0, ulid: 'shopify-user', name: shop.split('.')[0], email: shop }));
          }

          // Broadcast success signal
          localStorage.setItem('dm_auth_close_signal', Date.now().toString());
          try {
            const channel = new BroadcastChannel('auth_channel');
            channel.postMessage({ type: 'AUTH_SUCCESS', token, targetPath });
          } catch (e) { }

          setTimeout(() => { window.close(); }, 800);
          return;
        }

        // 4. DEATH SIGNAL (For Popups)
        if (isPopup) {
          window.addEventListener('storage', (e) => {
            if (e.key === 'dm_auth_close_signal') { window.close(); }
          });
        }
      } catch (err) { console.error(err); }
    })();
  </script>
</head>

<body>
  <div id="initial-loader">
    <div class="spinner"></div>
    <div class="loader-text">Authenticating</div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <script>
    // --- GUARANTEED LOADER DISMISSAL ---
    (function () {
      const dismiss = () => {
        const loader = document.getElementById('initial-loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => {
            loader.style.display = 'none';
            document.body.style.overflow = 'auto';
            document.documentElement.style.overflow = 'auto';
          }, 500);
        }
      };

      const urlParams = new URLSearchParams(window.location.search);
      const isPopup = window.name === 'shopify-login' || window.opener !== null || sessionStorage.getItem('is_dm_auth_popup') === '1';

      // If NOT in active auth redirect/callback, hide loader after a short delay
      if (!urlParams.get('shop') && !urlParams.get('token') && !isPopup) {
        setTimeout(dismiss, 100);
      } else {
        window.addEventListener('load', () => setTimeout(dismiss, 2500));
        setTimeout(dismiss, 8000); // Absolute safety fallback
      }
    })();
  </script>
</body>

</html>
